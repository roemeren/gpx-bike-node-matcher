name: Update Geofabrik Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose update mode"
        required: true
        default: "check-update" # also used for scheduled run
        type: choice
        options:
          - check-update
          - force-update
  # schedule:
  #   - cron: '0 2 * * 1' # weekly

jobs:
  check-latest:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.compare.outputs.update_needed }}
      latest_date: ${{ steps.get_latest.outputs.latest }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get current DATA_VERSION
        id: get_current
        run: |
          if [ -f data/processed/DATA_VERSION ]; then
            CURRENT=$(cat data/processed/DATA_VERSION)
          else
            CURRENT=0
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Get latest Geofabrik date
        id: get_latest
        run: |
          DATE=$(python scripts/geofabrik_date.py)
          echo "latest=$DATE" >> $GITHUB_OUTPUT

      - name: Compare dates
        id: compare
        run: |
          if [ "${{ steps.get_latest.outputs.latest }}" -gt "${{ steps.get_current.outputs.current }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Print dates
        run: |
          echo "Current DATA_VERSION: ${{ steps.get_current.outputs.current }}"
          echo "Latest Geofabrik date: ${{ steps.get_latest.outputs.latest }}"
  
  update-data:
    runs-on: ubuntu-latest
    needs: check-latest
    if: ${{ github.event.inputs.mode == 'force-update' || needs.check-latest.outputs.update_needed == 'true' }}
    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install Python requirements
      - name: Install Python requirements
        run: pip install -r requirements.txt

      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin

      # Restore & cache all Geofabrik files together
      - name: Restore & cache Geofabrik files
        id: geofabrik-cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: geofabrik-${{ needs.check-latest.outputs.latest_date }}

      # Download all Geofabrik files if cache was missed
      - name: Download Geofabrik files
        if: steps.geofabrik-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/raw
          while IFS= read -r REGION; do
            [ -z "$REGION" ] && continue
            SAFE_REGION="${REGION//\//-}"
            FILE_PATH="data/raw/${SAFE_REGION}-latest.osm.pbf"
            URL="https://download.geofabrik.de/europe/${REGION}-${{ needs.check-latest.outputs.latest_date }}.osm.pbf"
            echo "[INFO] Downloading $REGION OSM PBF..."
            curl -L "$URL" -o "$FILE_PATH"
            echo "[INFO] Download complete: $FILE_PATH"
          done < scripts/geofabrik_file_list.txt
        shell: bash
          
      # Run preprocessing script
      - name: Run Bash preprocessing for all regions
        run: |
          for FILE in data/raw/*.osm.pbf; do
            echo "[INFO] Running preprocessing for $FILE"
            bash scripts/geofabrik_preprocessing.sh ${{ needs.check-latest.outputs.latest_date }} "$FILE"
          done
        
